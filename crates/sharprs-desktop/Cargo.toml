[package]
name = "sharprs-desktop"
description = "Native desktop sounding workbench for SHARPrs"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[dependencies]
sharprs = { path = "../sharprs", features = ["observations"] }
eframe = { version = "0.31.1", default-features = false, features = ["accesskit", "default_fonts", "glow", "x11", "wayland"] }
rfd = "0.15.4"
sharprs-render = { workspace = true, features = ["serde"] }
sharprs-core = { workspace = true, features = ["serde"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
