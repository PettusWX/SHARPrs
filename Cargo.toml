[workspace]
resolver = "3"
members = ["crates/*"]
default-members = ["crates/sharprs", "crates/sharprs-cli", "crates/sharprs-core", "crates/sharprs-io", "crates/sharprs-render"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "BSD-3-Clause"
repository = "https://github.com/PettusWX/SHARPrs"
rust-version = "1.85"

[workspace.dependencies]
sharprs-core = { path = "crates/sharprs-core" }
sharprs-io = { path = "crates/sharprs-io" }
sharprs-render = { path = "crates/sharprs-render" }

[profile.release]
lto = "thin"
codegen-units = 1

[profile.dev.package."*"]
opt-level = 2
